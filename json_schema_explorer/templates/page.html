<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<style>
:root { --bg: #fff; --fg: #1a1a1a; --muted: #666; --line: #ddd; }
@media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #e8e8e8; --muted: #999; --line: #333; } }
body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
header { padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
#columns { display: flex; }
.column { min-width: 260px; border-right: 1px solid var(--line); }
.row { padding: 6px 16px; border-bottom: 1px solid var(--line); }
.type { color: var(--muted); margin-left: 8px; }
.req { color: #b00020; margin-left: 8px; font-size: 12px; }
</style>
<style>/* source view */
{{ source_css | safe }}
#source { display: none; padding: 0 16px; }
#source pre { overflow-x: auto; margin: 0; }
#show-source:checked ~ #source { display: block; }
#show-source:checked ~ #columns { display: none; }
</style>
</head>
<body>
<header>{{ title }}</header>
<input type="checkbox" id="show-source"><label for="show-source" style="padding:6px 16px;display:inline-block;cursor:pointer">Source</label>
<main id="columns"></main>
<div id="source">{{ source_html | safe }}</div>
<script id="node-table" type="application/json">{{ node_table | safe }}</script>
<script>
(function () {
  var table = JSON.parse(document.getElementById("node-table").textContent);
  var root = table["#"];
  var col = document.createElement("div");
  col.className = "column";
  root.children.forEach(function (c) {
    var node = table[c.target];
    var row = document.createElement("div");
    row.className = "row";
    row.appendChild(document.createTextNode(c.label));
    var t = document.createElement("span");
    t.className = "type";
    t.textContent = node.type;
    row.appendChild(t);
    if (root.required.indexOf(c.label) >= 0) {
      var r = document.createElement("span");
      r.className = "req";
      r.textContent = "required";
      row.appendChild(r);
    }
    col.appendChild(row);
  });
  document.getElementById("columns").appendChild(col);
})();
</script>
</body>
</html>
